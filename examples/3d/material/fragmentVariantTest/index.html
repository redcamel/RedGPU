<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../../assets/css/example.css" rel="stylesheet">
    <style>
        .variant-display {
            position: fixed;
            bottom: 70px;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 12px 12px 16px;
            gap: 6px;
            overflow-x: hidden;
            font-size: 16px;
            border: 1px solid #ff9800;
            z-index: 1000;
            pointer-events: none;
        }

        .variant-key {
            font-size: 16px;
            font-weight: bold;
            color: #ff9800;
            word-break: keep-all;
        }

        .variant-features {
            font-size: 12px;
            color: #e0e0e0;
        }
    </style>
    <script src="index.js" type="module"></script>
</head>
<body>
</body>
</html>
