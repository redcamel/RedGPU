<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../../assets/css/example.css" rel="stylesheet">
    <style>
        .skybox-preview {
            position: fixed;
            left: 50%;
            bottom: 60px;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: row;
            background-color: rgba(0, 0, 0, 0.3);
            gap: 8px;
            padding: 8px;
            border-radius: 8px;
            pointer-events: none;
            align-items: center;
            transition: bottom 0.2s ease-in-out;
        }

        .skybox-preview img {
            max-width: 60px;
            max-height: 60px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .skybox-preview {
                bottom: 150px;
            }
        }
    </style>
    <script src="index.js" type="module"></script>
</head>
<body>
</body>
</html>
