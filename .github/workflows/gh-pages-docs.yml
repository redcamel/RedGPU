name: Build Docs and Code on gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. 소스 코드 체크아웃 (master 브랜치 기준)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      # 2. Node.js 환경 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 이전 빌드 결과물 삭제 (소스 제외, gitignore된 파일들 삭제 - node_modules 포함)
      - name: Clean old build artifacts
        run: |
          git clean -fdX

      # 4. 의존성 패키지 설치 (Clean 이후에 실행해야 함)
      - name: Install dependencies
        run: npm ci

      # 5. 소스 코드 빌드 (Rollup)
      - name: Build code
        run: npm run build

      # 6. Inspector 빌드
      - name: Build Inspector
        run: |
          cd inspector
          npm ci
          npm run build

      # 7. Example Helper 빌드 및 정적 SEO 콘텐츠 주입
      - name: Build Example Helper and SEO tags
        run: |
          cd examples/exampleHelper
          npm ci
          npm run build
          cd ../..
          node buildScripts/github/generate-example-version.js

      # 8. 매뉴얼 빌드 (VitePress & TypeDoc API)
      - name: Build documentation
        run: |
          cd manual
          npm ci
          npm run build

      # 9. 전체 사이트맵 인덱스 생성 (SEO 최적화)
      - name: Build sitemap
        run: node buildScripts/github/generate-sitemap.js

      # 10. 변경된 빌드 결과물을 gh-pages 브랜치에 강제 커밋 및 푸시 (충돌 원천 차단)
      - name: Commit and force-push to gh-pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # manual, inspector, exampleHelper 내부 임시 빌드/의존성 폴더 제외 처리
          rm -rf manual/node_modules manual/.vitepress/dist manual/.vitepress/cache examples/exampleHelper/node_modules inspector/node_modules
          
          # docs 폴더 및 기존 sitemap_v2.xml 삭제 반영 (존재할 경우에만)
          git rm -rf --ignore-unmatch docs/ sitemap/ sitemap_v2.xml
          
          # 빌드 결과물 및 사이트맵 파일 추가
          git add dist/ inspector/dist/ manual/ examples/ sitemap.xml sitemap-examples.xml -f
          
          # 변경사항이 있는 경우 커밋 생성
          git diff --staged --quiet || git commit -m "chore: auto-build dist and docs with cache bursting [skip ci]"
          
          # master 기반 빌드 커밋을 gh-pages 브랜치에 충돌 없이 강제 덮어쓰기 배포
          git push --force origin HEAD:gh-pages
